<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nonogram Solver</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h1>Nonogram Solver</h1>
        <form id="input-form">
            <div class="input">
                <textarea id="hint-rows" value="" name="rows" pattern="^\d+(?:,\s*\d+)*(?:\n\d+(?:,\s*\d+)*)*$" placeholder="3, 2
2, 2, 3
1, 2, 1, 2
2, 4
3, 4
3, 5
10
6
3
3" required="">3, 2
2, 2, 3
1, 2, 1, 2
2, 4
3, 4
3, 5
10
6
3
3</textarea>
                <label for="hint-rows">Puzzle Row Hints</label>
            </div>
            <div class="input">
                <textarea id="hint-columns" value="" name="columns" pattern="^\d+(?:,\s*\d+)*(?:\n\d+(?:,\s*\d+)*)*$" placeholder="2, 2
2, 4
1, 5
5, 3
2, 5
6
8, 1
2, 4
6
2, 1" required="">2, 2
2, 4
1, 5
5, 3
2, 5
6
8, 1
2, 4
6
2, 1</textarea>
                <label for="hint-columns">Puzzle Column Hints</label>
            </div>
            <div class="input">
                <input type="submit" class="go-button" value="Go!">
            </div>
        </form>
        <div class="grid-div">
            <table id="grid">

            </table>
        </div>
        <p class="attribution">Sample input taken from <a href="https://www.nonograms.org/nonograms/i/79733">https://www.nonograms.org/nonograms/i/79733</a>.</p>

    </div>
    <script src="./index.js" type="module"></script>
</body>
</html>
